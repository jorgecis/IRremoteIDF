name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed by the GitHub Pages deployment below. Pages must be set to build
# from "GitHub Actions" in the repository settings, or the deploy step fails.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Doxygen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz
      - name: Generate
        run: doxygen Doxyfile
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/doxygen/html

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
