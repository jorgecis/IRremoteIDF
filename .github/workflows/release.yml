name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Work out the version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Check the tag matches idf_component.yml
        run: |
          MANIFEST=$(grep -m1 '^version:' idf_component.yml | tr -d ' "' \
            | cut -d: -f2)
          if [ "${MANIFEST}" != "${{ steps.version.outputs.version }}" ]; then
            echo "Tag says ${{ steps.version.outputs.version }} but" \
                 "idf_component.yml says ${MANIFEST}." >&2
            exit 1
          fi

      - name: Extract the changelog section
        run: |
          awk -v v="## ${{ steps.version.outputs.version }}" '
            $0 == v {found = 1; next}
            found && /^## / {exit}
            found {print}
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG.md section for" \
                 "${{ steps.version.outputs.version }}" >&2
            exit 1
          fi
          cat release-notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file release-notes.md
